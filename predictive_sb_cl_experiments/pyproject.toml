[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-sb-cl-experiments"
version = "0.1.0"
description = "Falsifiable predictive-space Schrodinger bridge experiments for continual learning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
ipsb-train = "ipsb.train:main"
ipsb-summarize = "ipsb.summarize:main"

[tool.setuptools.packages.find]
include = ["ipsb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
