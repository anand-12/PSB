[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-weight-diffusion-cl"
version = "0.1.0"
description = "Likelihood-guided weight diffusion for replay-free continual learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
gwd-train = "gwd_cl.train:main"
gwd-summarize = "gwd_cl.summarize:main"

[tool.setuptools.packages.find]
include = ["gwd_cl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

